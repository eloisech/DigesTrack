<!-- Structure HTML de base -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>DigesTrack</title>
    <link rel="stylesheet" href="css/style.css"> <!-- Liaison avec le code css -->
</head>
<body>
    <!-- Header principal -->
    <header>
        <h1>DigesTrack</h1>
        <p>Journal nutrition & digestion</p>
    </header>

    <main>
        <!-- 1ère section : Statistiques -->
        <section id="statistiques">
            <h2>📊 Statistiques et Analyses</h2>

            <!-- Graphique 1 : Répartition générale des symptômes -->
            <div id="conteneurGraphique" class="conteneurGraphiqueIndividuel">
                <h3 class="titreGraphique">Répartition des symptômes</h3>
                <canvas id="graphiqueSymptomes"></canvas>
            </div>

            <!-- Graphique 2 : Top aliments à risque -->
            <div id="conteneurTopAliments" class="conteneurGraphiqueIndividuel">
                <h3 class="titreGraphique">🚨 Top 10 des aliments à risque</h3>
                <canvas id="graphiqueTopAliments"></canvas>
            </div>

            <!-- Graphique 3 : Symptômes par catégorie d'aliments -->
            <div id="conteneurCategories" class="conteneurGraphiqueIndividuel">
                <h3 class="titreGraphique">📂 Symptômes par catégorie</h3>
                <canvas id="graphiqueCategories"></canvas>
            </div>

            <!-- Analyse intelligente -->
            <div id="analyseIntelligente">
                <h3 class="titreGraphique">💡 Analyse intelligente</h3>
                <div id="contenuAnalyse"></div>
            </div>
        </section>

        <!-- 2ème section : Historique -->
        <section id="historique">
            <h2> 📜Historique </h2>
            <div id="listeJournees">
                <p>Aucune journée enregistrée pour le moment.</p>
            </div>

            <button class="boutonExportCSV">📥 Exporter en CSV</button>
        </section>

    </main>

    <!-- Bouton flottant pour ouvrir le formulaire -->
     <button id="boutonOuvrirFormulaire" class="boutonFlottant" title="Ajouter une journée">➕</button>

     <!-- Overlay (fond sombre) avec le formulaire -->
      <div id="overlayFormulaire" class="overlay">
        <div class="modalFormulaire">
            <!-- Bouton fermer -->
            <button id="boutonFermerFormulaire" class="boutonFermer">✖</button>
            <h2>📝 Ajouter une journée</h2>

            <form id="monFormulaire">
                <label>Date :</label>
                <input type="date" id="date" max="">

                <h3 class="sousTitreFormulaire">🍽️ Aliments consommés</h3>

                <label>🌾 Féculents :</label>
                <input type="text" id="feculents" placeholder="Ex: riz, pâtes, pain, pommes de terre">

                <label>🥩 Protéines :</label>
                <input type="text" id="proteines" placeholder="Ex: poulet, poisson, oeufs, tofu">

                <label>🥬 Légumes :</label>
                <input type="text" id="legumes" placeholder="Ex: épinards, carottes, tomates">

                <label>🍎 Fruits :</label>
                <input type="text" id="fruits" placeholder="Ex: pomme, banane, orange">

                <label>🥛 Produits laitiers :</label>
                <input type="text" id="laitiers" placeholder="Ex: lait, yaourt, fromage">

                <label>🥑 Lipides :</label>
                <input type="text" id="lipides" placeholder="Ex: huile d'olive, beurre, avocat, noix">

                <label>☕ Boissons :</label>
                <input type="text" id="boissons" placeholder="Ex: eau, café, thé, jus d'orange, boisson isotonique">

                <label>🍯 Autres :</label>
                <input type="text" id="autres" placeholder="Ex: sauce, condiments, snacks">

                <label class="labelSport">Sport(s) pratiqué(s) :</label>
                <div class="checkboxGroup">
                    <label class="checkboxLabel">
                        <input type="checkbox" name="sport" value="natation">Natation
                    </label>
                    <label class="checkboxLabel">
                        <input type="checkbox" name="sport" value="velo">Vélo
                    </label>
                    <label class="checkboxLabel">
                        <input type="checkbox" name="sport" value="course">Course à pied
                    </label>
                    <label class="checkboxLabel">
                        <input type="checkbox" name="sport" value="aucun" id="sport-aucun">Aucun
                    </label>
                </div>

                <label>Symptômes digestifs :</label>
                <select id="symptomes" required>
                    <option value="">-- Choisir --</option>
                    <option value="aucun">Aucun</option>
                    <option value="leger">Léger</option>
                    <option value="important">Important</option>
                </select>

                <button type="submit">Enregistrer</button>
            </form>
        </div>
      </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/app.js"></script> <!-- Liaison avec le code JavaScript -->
</body>
</html>
